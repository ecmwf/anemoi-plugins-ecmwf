# ---------------------------------------------------------------------------
# Multio -> GRIB integration sweep: ensemble (enfo) stream.
#
# Mirrors ``sweep_oper.yaml`` but exercises the perturbed-forecast (type ``pf``)
# ensemble path, checking the ensemble product-definition keys
# (perturbationNumber / number, numberOfForecastsInEnsemble) survive encoding.
# See the multio.log reference: ``type=pf`` fields carry stream oper/enfo/wave.
#
# Structure of a case:
#   name        : unique, human readable id (used as the pytest parametrize id)
#   grid        : gaussian grid, drives the number of values in the payload
#   user        : UserDefinedMetadata (class/type/stream/expver/model/...)
#   reference   : {date: YYYYMMDD, time: HHMM} forecast reference (analysis) time
#   step        : forecast step, hours (int) or metkit duration string ("1800s")
#   variable    : anemoi-transform Variable spec (mars keys + optional process)
#   field       : optional field generation controls (fill / nan_fraction)
#   expect      : GRIB header keys checked against the round-tripped message
#
# Overriding defaults:
#   Any key under ``defaults`` can be overridden per case. Mappings are merged
#   key by key, so a case only lists what changes, e.g.
#     user: {generatingProcessIdentifier: 5}   # keeps class/type/stream/...
#     reference: {time: 1200}                  # keeps the default date
#   Scalars and lists replace the default outright (grid: O96, step: 12).
#   Setting ``steps`` replaces the default ``step`` (and vice versa).
#   Set an optional user key to ``null`` to drop it, e.g. ``user: {model: null}``.
# ---------------------------------------------------------------------------

defaults:
  grid: O48
  user:
    class: ai
    type: pf
    stream: enfo
    expver: "0001"
    model: aifs-ens
    number: 1
    numberOfForecastsInEnsemble: 50
    generatingProcessIdentifier: 3
  reference:
    date: 20260923
    time: 0000
  step: 0

cases:
  # --- ensemble member routing --------------------------------------------
  - name: enfo-2t-member1
    variable:
      name: 2t
      mars: {param: 2t, levtype: sfc}
    expect:
      shortName: 2t
      paramId: 167
      stream: enfo
      type: pf
      number: 1
      perturbationNumber: 1
      numberOfForecastsInEnsemble: 50
      levtype: sfc

  - name: enfo-2t-member25
    user:
      number: 25
    variable:
      name: 2t
      mars: {param: 2t, levtype: sfc}
    expect:
      stream: enfo
      type: pf
      number: 25
      perturbationNumber: 25
      numberOfForecastsInEnsemble: 50

  # --- ensemble pressure level ---------------------------------------------
  - name: enfo-t-500-step12
    step: 12
    variable:
      name: t_500
      mars: {param: t, levtype: pl, levelist: 500}
    expect:
      shortName: t
      paramId: 130
      levtype: pl
      level: 500
      step: 12
      stream: enfo
      type: pf
      number: 1

  # --- ensemble accumulation -----------------------------------------------
  - name: enfo-tp-accum-0-6
    step: 6
    variable:
      name: tp
      process: accumulation
      period: [0, 6]
      mars: {param: tp, levtype: sfc}
    expect:
      levtype: sfc
      stepRange: 0-6
      startStep: 0
      endStep: 6
      typeOfStatisticalProcessing: 1
      stream: enfo
      type: pf
      number: 1

  # --- ensemble with 12Z reference time ------------------------------------
  # multio 2.10 encodes time as hours (1200 -> 12); 2.11 keeps HHMM.
  - name: enfo-msl-time1200-step18
    reference: {date: 20260923, time: 1200}
    step: 18
    min_multio: "2.11"
    variable:
      name: msl
      mars: {param: msl, levtype: sfc}
    expect:
      shortName: msl
      paramId: 151
      dataDate: 20260923
      dataTime: 1200
      step: 18
      stream: enfo
      type: pf
